<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="870" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#202124">submission-gates · 复核后结构图</text>
  <text x="40" y="68" font-size="13" fill="#5f6368">upstream 5e7dc7eb → 38976afd 同步后的门禁架构:三道准入门 + 两条保鲜线 + 一条监督线(行号级细节见四篇笔记)</text>

  <!-- 图例 -->
  <rect x="40" y="84" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="62" y="97" font-size="12" fill="#37474f">未变化</text>
  <rect x="150" y="84" width="16" height="16" rx="3" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="172" y="97" font-size="12" fill="#37474f">本轮变更(5e7dc7eb→38976afd)</text>
  <rect x="360" y="84" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="382" y="97" font-size="12" fill="#37474f">本轮新增</text>
  <rect x="490" y="84" width="16" height="16" rx="3" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="512" y="97" font-size="12" fill="#37474f">角色 / 队列</text>

  <!-- ============ ① 准入门 ============ -->
  <text x="40" y="140" font-size="14" font-weight="bold" fill="#37474f">① 准入门 —— 把形式问题在合并前拦下</text>

  <!-- 角色:投稿 -->
  <rect x="40" y="230" width="100" height="56" rx="8" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="90" y="254" font-size="13" text-anchor="middle" fill="#202124">PR 投稿</text>
  <text x="90" y="272" font-size="10" text-anchor="middle" fill="#757575">(作者)</text>

  <!-- pr-check -->
  <rect x="180" y="155" width="250" height="210" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="362" y="145" width="52" height="20" rx="10" fill="#ef6c00"/>
  <text x="388" y="159" font-size="11" text-anchor="middle" fill="#ffffff">变更</text>
  <text x="194" y="178" font-size="14" font-weight="bold" fill="#202124">pr-check.yml · 形式层</text>
  <text x="194" y="196" font-size="11" fill="#616161">pull_request · 无 token · fork 安全</text>
  <text x="194" y="216" font-size="12" fill="#37474f">• stale-fork 守卫 → 数条目文件</text>
  <text x="194" y="232" font-size="12" fill="#9e9e9e">   (原为数 README 删除行)</text>
  <text x="194" y="248" font-size="12" fill="#37474f">• 新 路径守卫:须 data/plugins/</text>
  <text x="194" y="264" font-size="12" fill="#37474f">   恰好一层 #3914 #3622</text>
  <text x="194" y="280" font-size="12" fill="#37474f">• 扩展名守卫 · README 两种形态</text>
  <text x="194" y="296" font-size="12" fill="#37474f">• awesome-lint · 站点构建(6 步)</text>
  <text x="194" y="316" font-size="11" fill="#757575">regenerate on main → check 可缺席</text>

  <!-- pr-gate -->
  <rect x="470" y="155" width="280" height="210" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="682" y="145" width="52" height="20" rx="10" fill="#ef6c00"/>
  <text x="708" y="159" font-size="11" text-anchor="middle" fill="#ffffff">变更</text>
  <text x="484" y="178" font-size="14" font-weight="bold" fill="#202124">pr-gate.yml · 实质层(判决机)</text>
  <text x="484" y="196" font-size="11" fill="#616161">workflow_run · 有 token · checkout 停在 main</text>
  <text x="484" y="216" font-size="12" fill="#37474f">• dsh.bundle 清单(hasBundle 三层)</text>
  <text x="484" y="232" font-size="12" fill="#37474f">• 年龄≥1 天 —— 提交数下限删除 #4196</text>
  <text x="484" y="248" font-size="12" fill="#37474f">   已收录仓库豁免 #3609</text>
  <text x="484" y="264" font-size="12" fill="#37474f">• ≤3 条/PR · 任何请求前即拒</text>
  <text x="484" y="280" font-size="12" fill="#37474f">• 判决:success / neutral / failure</text>
  <text x="484" y="296" font-size="12" fill="#37474f">   neutral = fail-open 但自曝</text>
  <line x1="484" y1="308" x2="736" y2="308" stroke="#ef6c00" stroke-opacity="0.4"/>
  <text x="484" y="326" font-size="11" fill="#757575">└ check-submission.mjs(584 行,变更)</text>
  <text x="484" y="342" font-size="11" fill="#757575">└ check-bleed.mjs(未变,报而不拦)</text>

  <!-- 合并队列 -->
  <rect x="800" y="230" width="110" height="56" rx="8" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="855" y="254" font-size="13" text-anchor="middle" fill="#202124">合并队列</text>
  <text x="855" y="272" font-size="10" text-anchor="middle" fill="#757575">(按 label 批量合并)</text>

  <!-- pr-guard -->
  <rect x="950" y="155" width="250" height="210" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="1120" y="145" width="64" height="20" rx="10" fill="#2e7d32"/>
  <text x="1152" y="159" font-size="11" text-anchor="middle" fill="#ffffff">未变化</text>
  <text x="964" y="178" font-size="14" font-weight="bold" fill="#202124">pr-guard.yml · 元检查</text>
  <text x="964" y="196" font-size="11" fill="#616161">自 main 的 schedule 37 * * * *(爆炸半径外)</text>
  <text x="964" y="216" font-size="12" fill="#37474f">• PR 删 workflow 文件 → 零检查</text>
  <text x="964" y="232" font-size="12" fill="#37474f">• 动 .github/ = stale fork 指纹</text>
  <text x="964" y="248" font-size="12" fill="#37474f">• 判决每轮重算,变化才张贴 #1624</text>
  <text x="964" y="264" font-size="12" fill="#37474f">• "无检查"满 90 分钟才标</text>
  <text x="964" y="280" font-size="12" fill="#37474f">• GraphQL 分页查询,护 1000/h 配额</text>

  <!-- 流箭头 -->
  <line x1="140" y1="258" x2="176" y2="258" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="258" x2="466" y2="258" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="258" x2="796" y2="258" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="948" y1="300" x2="914" y2="262" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ============ ② 保鲜线 ============ -->
  <text x="40" y="418" font-size="14" font-weight="bold" fill="#37474f">② 保鲜线 —— 判决是快照、held 不自愈,都要重访</text>

  <!-- regate -->
  <rect x="180" y="435" width="380" height="170" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="492" y="425" width="52" height="20" rx="10" fill="#ef6c00"/>
  <text x="518" y="439" font-size="11" text-anchor="middle" fill="#ffffff">变更</text>
  <text x="194" y="458" font-size="14" font-weight="bold" fill="#202124">regate.yml · 判决保鲜</text>
  <text x="194" y="476" font-size="11" fill="#616161">每 6h · MAX_RERUNS=20 · oldest-first</text>
  <text x="194" y="496" font-size="12" fill="#37474f">• blocking:从未被判 / neutral / aged-in</text>
  <text x="194" y="513" font-size="12" fill="#37474f">• revalidate:判决早于当前门禁代码</text>
  <text x="194" y="530" font-size="12" fill="#37474f">• speculative:绿灯超 48h(#1022)</text>
  <text x="194" y="547" font-size="12" fill="#37474f">• aged 匹配 /days old/ — commit(s) 已死代码</text>
  <text x="194" y="564" font-size="12" fill="#37474f">• 层序:blocking → revalidate → speculative</text>

  <!-- held-rescan -->
  <rect x="620" y="435" width="380" height="170" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="944" y="425" width="40" height="20" rx="10" fill="#1565c0"/>
  <text x="964" y="439" font-size="11" text-anchor="middle" fill="#ffffff">新增</text>
  <text x="634" y="458" font-size="14" font-weight="bold" fill="#202124">held-rescan.yml · 人工 held 保鲜</text>
  <text x="634" y="476" font-size="11" fill="#616161">每日 06:19 UTC · issues:write · 不 checkout、不跑 PR 代码</text>
  <text x="634" y="496" font-size="12" fill="#37474f">• held: author + gate 绿 + hold 后作者有动</text>
  <text x="634" y="513" font-size="12" fill="#37474f">   → 单一 issue 清单(按等待天数倒序)</text>
  <text x="634" y="530" font-size="12" fill="#37474f">• 绝不自动摘 label:只有重审能退休</text>
  <text x="634" y="547" font-size="12" fill="#37474f">• NEUTRAL 不算过;红 check 展示不筛(#3832)</text>
  <text x="634" y="564" font-size="12" fill="#37474f">• 09-07 重扫:11 个超期 #2233 17d 等</text>

  <!-- 保鲜线箭头 -->
  <path d="M300,435 L300,412 L610,412 L610,371" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="406" font-size="10" fill="#757575">重跑 PR check → 级联 gate · aged 自动翻绿</text>
  <line x1="810" y1="435" x2="810" y2="292" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="320" font-size="10" fill="#757575">重审从清单出发</text>

  <!-- ============ ③ 监督 ============ -->
  <text x="40" y="648" font-size="14" font-weight="bold" fill="#37474f">③ 监督 —— 收录后的持续盯梢,不属于准入</text>
  <rect x="180" y="665" width="380" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="492" y="655" width="64" height="20" rx="10" fill="#2e7d32"/>
  <text x="524" y="669" font-size="11" text-anchor="middle" fill="#ffffff">未变化</text>
  <text x="194" y="690" font-size="13" font-weight="bold" fill="#202124">decay-scan.yml · 持续监督</text>
  <text x="194" y="712" font-size="11" fill="#616161">仓库消失 / 归档 / 长期停更 → 跟踪 issue → 人工确认后移除</text>

  <!-- ============ 框架判定 ============ -->
  <rect x="40" y="760" width="1160" height="84" rx="10" fill="#fafafa" stroke="#b0bec5"/>
  <text x="56" y="786" font-size="13" font-weight="bold" fill="#37474f">框架判定(复核结论)</text>
  <text x="56" y="806" font-size="12" fill="#37474f">五道门禁 → 3 + 2 + 1:三道准入门(pr-check 形式 · pr-gate 实质 · pr-guard 元检查)+ 两条保鲜线(regate · held-rescan)+ 一条监督线(decay-scan)</text>
  <text x="56" y="824" font-size="12" fill="#37474f">held-rescan 不做判决、不加闸——它是 regate 的"人工半区";内容级框架(判决四种出口、unverified ≠ problems、fail-open 但自曝)全部仍成立</text>
</svg>
